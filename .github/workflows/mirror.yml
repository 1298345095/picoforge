name: Mirror (upstream only)
# Fork safety: mirrors are only for the original librekeys repository.
# Never run automatically or write to upstream mirror destinations from forks.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mirror-gitlab:
    if: github.repository == 'librekeys/picoforge'
    concurrency:
      group: ${{ github.workflow }}-gitlab
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - run: git clone --bare "https://github.com/librekeys/picoforge" .
      - run: git push --mirror "https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@gitlab.com/librekeys/picoforge.git"
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
  mirror-codeberg:
    if: github.repository == 'librekeys/picoforge'
    concurrency:
      group: ${{ github.workflow }}-codeberg
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - run: git clone --bare "https://github.com/librekeys/picoforge" .
      - run: git push --mirror "https://${CODEBERG_USERNAME}:${CODEBERG_TOKEN}@codeberg.org/librekeys/picoforge.git"
        env:
          CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
  mirror-disroot:
    if: github.repository == 'librekeys/picoforge'
    concurrency:
      group: ${{ github.workflow }}-disroot
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - run: git clone --bare "https://github.com/librekeys/picoforge" .
      - run: git push --mirror "https://${DISROOT_USERNAME}:${DISROOT_TOKEN}@git.disroot.org/librekeys/picoforge.git"
        env:
          DISROOT_USERNAME: ${{ secrets.DISROOT_USERNAME }}
          DISROOT_TOKEN: ${{ secrets.DISROOT_TOKEN }}
